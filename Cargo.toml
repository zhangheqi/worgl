[workspace]
resolver = "3"
members = [
    "crates/worgl",
    "crates/worgl-cli",
    "crates/worgl-client",
    "crates/worgl-faucet",
    "crates/worgl-raft",
    "crates/worgl-sdk",
    "crates/worgl-server",
    "crates/worgl-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhangheqi/worgl"
authors = ["The Worgl contributors"]

[workspace.dependencies]
worgl = { path = "crates/worgl", version = "0.1.0" }
worgl-client = { path = "crates/worgl-client", version = "0.1.0" }
worgl-faucet = { path = "crates/worgl-faucet" }
worgl-raft = { path = "crates/worgl-raft" }
worgl-sdk = { path = "crates/worgl-sdk", version = "0.1.0" }
worgl-server = { path = "crates/worgl-server" }

anyhow = "1"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
httpdate = "1"
openraft = { version = "0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data"] }
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasm-bindgen = "0.2.129"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"

# Signature checks dominate the test suite; optimise the crypto even in debug builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Deriving a purse's key from its passphrase is just as slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
