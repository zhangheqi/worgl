[workspace]
resolver = "3"
members = [
    "crates/worgl",
    "crates/worgl-cli",
    "crates/worgl-client",
    "crates/worgl-faucet",
    "crates/worgl-raft",
    "crates/worgl-sdk",
    "crates/worgl-server",
    "crates/worgl-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhangheqi/worgl"
homepage = "https://zhangheqi.github.io/worgl/"
authors = ["The Worgl contributors"]

[workspace.dependencies]
# Crates that are only ever dev-dependencies take no version: cargo drops them
# from a package's manifest when it publishes.
worgl = { path = "crates/worgl", version = "0.1.0" }
worgl-client = { path = "crates/worgl-client", version = "0.1.0" }
worgl-faucet = { path = "crates/worgl-faucet" }
worgl-raft = { path = "crates/worgl-raft", version = "0.1.0" }
worgl-sdk = { path = "crates/worgl-sdk", version = "0.1.0" }
worgl-server = { path = "crates/worgl-server" }

anyhow = "1"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
httpdate = "1"
# Without its default features, js-sys leaves out the bindings that need a
# page's Content Security Policy to allow `unsafe-eval`.
js-sys = { version = "0.3.106", default-features = false }
# With `loosen-follower-log-revert`, a leader that finds a follower lacks
# entries the leader had counted it as holding, as after the member was
# restored from an older copy of its directory, logs a warning ("follower
# log is reverted"), searches that log again from the start and sends what
# it lacks, as entries or as a snapshot. Without it openraft takes this for
# a bug: a leader built with debug assertions panics, and a release build
# can send entries that do not follow the follower's log, as after a purge,
# which stops the follower's replica. It does not make restoring one member
# on its own safe; see the Backups page of the docs. Tests no longer panic
# on it either, so the simulation fails a run in which the warning is
# logged: there it means a replica lost entries it had flushed.
openraft = { version = "0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data", "loosen-follower-log-revert"] }
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
rpassword = "7"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasm-bindgen = "0.2.129"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"

# Signature checks dominate the test suite; optimise the crypto even in debug builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Deriving a purse's key from its passphrase is just as slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
