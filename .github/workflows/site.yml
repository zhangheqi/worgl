name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Deploying needs GitHub Pages turned on with GitHub Actions as its source.
  # Until it is, merges to main build the site and skip the deploy.
  pages:
    name: check GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      on: ${{ steps.check.outputs.on }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not set to deploy from GitHub Actions in this repository's settings, so the site was built but not deployed."
          fi

  deploy:
    name: deploy to GitHub Pages
    needs: pages
    if: needs.pages.outputs.on == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: configure
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.configure.outputs.origin }}
          SITE_BASE: ${{ steps.configure.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
