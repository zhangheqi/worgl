[package]
name = "worgl-sdk"
description = "The holder's side of Worgl: a note store that pays, receives and refreshes notes while keeping the privacy rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["token", "credits", "wallet", "sdk"]
categories = ["cryptography"]

[features]
# Purse files: a holder sealed under a passphrase, as `worgl` keeps its purse.
vault = ["dep:argon2", "dep:base64", "dep:chacha20poly1305", "dep:zeroize"]

[dependencies]
# With `zeroize`, argon2's memory blocks can be erased once a key is derived.
argon2 = { workspace = true, optional = true, features = ["zeroize"] }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true, features = ["zeroize"] }
getrandom.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
worgl.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
